[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jobapply"
version = "0.1.0"
description = "Job-application pipeline with agent skills for the judgment steps: JSON profile -> PDF documents -> pre-filled web forms. A human always presses submit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
    "markdown>=3.5",
    "pypdf>=4.0",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobapply = "jobapply.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobapply = ["templates/*", "templates/styles/*", "defaults/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
